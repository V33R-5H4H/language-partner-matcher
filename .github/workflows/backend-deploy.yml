name: Backend CI/CD

# Temporarily disabled automatic triggers until new architecture is implemented
# To re-enable automatic CI/CD, uncomment the push and pull_request sections below.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths:
  #     - 'backend/**'
  #     - '.github/workflows/backend-deploy.yml'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'backend/**'

env:
  AWS_REGION: "ap-south-1"
  ECR_REPOSITORY: "langmatcher-backend"
  IMAGE_TAG: "${{ github.sha }}"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Lint & Test (runs on every PR and push to main)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies with uv
        run: |
          uv pip install --system -r requirements.txt ruff pytest httpx pytest-asyncio
      - name: Lint with Ruff
        run: ruff check app/ --output-format=github || echo "Ruff lint warnings - continuing"
      - name: Run tests
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/langmatcher"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "test_secret_key_ci_only"
          TURN_SHARED_SECRET: "test_turn_secret"
          ENVIRONMENT: "test"
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found - skipping"
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker Image to ECR (main or manual dispatch)
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cd backend
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker tag "$IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: SSH Deploy to EC2 (main or manual dispatch)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout: 120s
          script: |
            set -e
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              $(echo "${{ needs.build-and-push.outputs.image }}" | cut -d'/' -f1)
            cd /home/ubuntu/app/backend
            cat > docker-compose.override.yml << OVERRIDE
            services:
              fastapi_backend:
                image: ${{ needs.build-and-push.outputs.image }}
            OVERRIDE
            if [ -f "docker-compose.decoupled.yml" ]; then
              docker compose -f docker-compose.decoupled.yml -f docker-compose.override.yml up -d --no-build
            else
              docker compose -f docker-compose.prod.yml -f docker-compose.override.yml up -d --no-build
            fi
            sleep 10
            curl -sf http://localhost:8000/api/v1/health || \
              (echo "Health check failed" && docker compose logs fastapi_backend --tail=30 && exit 1)
            docker image prune -f --filter "until=24h"
            echo "Deployed ${{ github.sha }} successfully"
      - name: Write deploy summary
        if: always()
        run: |
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
