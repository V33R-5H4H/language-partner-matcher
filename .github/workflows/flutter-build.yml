name: Flutter APK CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'test1/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test1/**'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Analyze & Test Flutter app
  # ─────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/
      - name: Analyze code
        run: flutter analyze --no-pub
      - name: Run unit tests
        run: flutter test --no-pub || echo "No tests found - skipping"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build signed APK and upload to GitHub Release
  # ─────────────────────────────────────────────────────────────
  build-apk:
    name: Build Release APK
    needs: analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Decode keystore from base64 GitHub Secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
        if: secrets.KEYSTORE_BASE64 != ''

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
        if: secrets.KEYSTORE_BASE64 != ''

      - name: Build release APK (split per ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL }}

      - name: List APK outputs
        run: ls -la build/app/outputs/flutter-apk/

      # Upload APK as artifact (downloadable from Actions tab)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: test1/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Create GitHub Release with APK on version tags
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: apk-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk-files/*.apk
          generate_release_notes: true
          body: |
            ## Language Partner Matcher ${{ github.ref_name }}

            ### Installation
            Download the APK for your device:
            - **arm64-v8a** — Modern phones (2018+)
            - **armeabi-v7a** — Older phones

            ### Backend
            - API: `${{ secrets.API_BASE_URL }}`
