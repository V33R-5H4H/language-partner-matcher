name: Flutter APK & Web CI/CD

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'test1/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test1/**'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Analyze & Test Flutter app
  # ─────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ || echo "Formatting check warning - continuing"
      - name: Analyze code
        run: flutter analyze --no-pub
      - name: Run unit tests
        run: flutter test --no-pub || echo "No tests found - skipping"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build Main Release APK (Universal)
  # ─────────────────────────────────────────────────────────────
  build-apk:
    name: Build Main Release APK
    needs: analyze
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get


      # Build single main release APK
      - name: Build main release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL || 'ws://13.235.12.217:8000' }}

      - name: List APK outputs
        run: ls -la build/app/outputs/flutter-apk/

      # Upload main APK as Actions artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: test1/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Build Flutter Web (Configured for /web/ Subpath)
  # ─────────────────────────────────────────────────────────────
  build-web:
    name: Build Flutter Web Bundle
    needs: analyze
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Build Web bundle with base-href /web/ so it runs on http://<server-ip>:8000/web/
      - name: Compile Flutter Web
        run: |
          flutter build web --release \
            --base-href "/web/" \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL || 'ws://13.235.12.217:8000' }}

      - name: Package Web Build as Zip
        run: |
          cd build/web
          zip -r ../../flutter-web-build.zip .

      - name: Upload Web Build Directory Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build-${{ github.sha }}
          path: test1/build/web/
          retention-days: 30

      - name: Upload Web Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-zip-${{ github.sha }}
          path: test1/flutter-web-build.zip
          retention-days: 30

      - name: Display Summary in GitHub Actions
        run: |
          WEB_URL="${{ secrets.WEB_APP_URL || (secrets.API_BASE_URL && format('{0}/web/', secrets.API_BASE_URL)) || 'http://13.235.12.217:8000/web/' }}"
          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 **Main Android APK**: Built and attached as artifact \`app-release.apk\`." >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Live Web Application**: [Open in Browser ($WEB_URL)]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Web Build Archive**: Packaged as \`flutter-web-build.zip\` ready for deployment." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Publish Main APK & Web Zip to GitHub Releases
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish to GitHub Releases
    needs: [build-apk, build-web]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: release-assets/

      - name: Download Web Zip artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-zip-${{ github.sha }}
          path: release-assets/

      - name: Determine Release Tag and Title
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Language Partner Matcher ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest Continuous Build (main)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Purge old split APK assets from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset latest app-arm64-v8a-release.apk --yes 2>/dev/null || true
          gh release delete-asset latest app-armeabi-v7a-release.apk --yes 2>/dev/null || true
          gh release delete-asset latest app-x86_64-release.apk --yes 2>/dev/null || true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### 🌐 Language Partner Matcher — Build Assets

            #### 💻 Live Web Application:
            - **Browser URL**: [${{ secrets.WEB_APP_URL || (secrets.API_BASE_URL && format('{0}/web/', secrets.API_BASE_URL)) || 'http://13.235.12.217:8000/web/' }}](${{ secrets.WEB_APP_URL || (secrets.API_BASE_URL && format('{0}/web/', secrets.API_BASE_URL)) || 'http://13.235.12.217:8000/web/' }})
            - **Backend Endpoint**: `${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }}`
            - **Commit**: `${{ github.sha }}`

            #### 📥 Download Client Binaries:
            - **`app-release.apk`**: Main Universal APK for all Android devices
            - **`flutter-web-build.zip`**: Standalone web build bundle
