name: Flutter APK & Web CI/CD

# Temporarily disabled automatic triggers until new architecture is implemented
# To re-enable automatic CI/CD, uncomment the push and pull_request sections below.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'test1/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test1/**'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Analyze & Test Flutter app
  # ─────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ || echo "Formatting check warning - continuing"
      - name: Analyze code
        run: flutter analyze --no-pub
      - name: Run unit tests
        run: flutter test --no-pub || echo "No tests found - skipping"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build release APKs (Universal + Split per ABI)
  # ─────────────────────────────────────────────────────────────
  build-apk:
    name: Build Release APKs
    needs: analyze
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Configure keystore if secret exists
      - name: Configure keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" "$KEYSTORE_KEY_ALIAS" > android/key.properties
          else
            echo "No KEYSTORE_BASE64 secret provided - proceeding with default build"
          fi

      # 1. Build Split-per-ABI APKs (smaller downloads for phones)
      # Requires GitHub Secrets: API_BASE_URL, WS_BASE_URL
      - name: Build split-per-abi APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL }}

      # 2. Build Universal APK (works on all architectures)
      - name: Build universal APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL }}

      - name: List APK outputs
        run: ls -la build/app/outputs/flutter-apk/

      # Upload APKs as Actions artifact
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ github.sha }}
          path: test1/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Build Flutter Web (Access Remotely in Browser)
  # ─────────────────────────────────────────────────────────────
  build-web:
    name: Build Flutter Web for Browser
    needs: analyze
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Requires GitHub Secrets: API_BASE_URL, WS_BASE_URL
      - name: Compile Flutter Web
        run: |
          flutter build web --release \
            --base-href "/language-partner-matcher/" \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL || 'ws://13.235.12.217:8000' }}

      - name: Package Web Build as Zip
        run: |
          cd build/web
          zip -r ../../flutter-web-build.zip .

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: test1/build/web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build-${{ github.sha }}
          path: test1/build/web/
          retention-days: 30

      - name: Upload Web Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-zip-${{ github.sha }}
          path: test1/flutter-web-build.zip
          retention-days: 30

      - name: Display Web Interface Link in GitHub Summary
        run: |
          echo "## 🌐 Flutter Web on GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The web application is automatically deployed to **GitHub Pages**!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Live Web App**: [https://v33r-5h4h.github.io/language-partner-matcher/](https://v33r-5h4h.github.io/language-partner-matcher/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API**: \`${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signaling Endpoint**: \`${{ secrets.WS_BASE_URL || 'ws://13.235.12.217:8000' }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Deploy Flutter Web to GitHub Pages
  # ─────────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────────────────────
  # JOB 5: Route APKs & Web to GitHub Releases
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish to GitHub Releases
    needs: [build-apk, build-web]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apks-${{ github.sha }}
          path: release-assets/

      - name: Download Web Zip artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-zip-${{ github.sha }}
          path: release-assets/

      - name: Determine Release Tag and Title
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Language Partner Matcher ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest Continuous Build (main)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### 🌐 Language Partner Matcher — Build Assets

            #### 💻 Instant Web Interface Access
            - **Live Web App (GitHub Pages)**: [https://v33r-5h4h.github.io/language-partner-matcher/](https://v33r-5h4h.github.io/language-partner-matcher/)
            - **Backend Endpoint**: `${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`

            #### 📥 Download Client Binaries:
            - **`app-release.apk`**: Universal APK (Works on any Android phone)
            - **`app-arm64-v8a-release.apk`**: Optimized for modern 64-bit phones (smaller size)
            - **`flutter-web-build.zip`**: Standalone production web build for hosting on S3 / Nginx / CloudFront

            ---
            *Built and published automatically by GitHub Actions CI/CD.*
