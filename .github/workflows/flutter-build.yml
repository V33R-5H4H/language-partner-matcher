name: Flutter APK & Web CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'test1/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test1/**'

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Analyze & Test Flutter app
  # ─────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/ || echo "Formatting check warning - continuing"
      - name: Analyze code
        run: flutter analyze --no-pub
      - name: Run unit tests
        run: flutter test --no-pub || echo "No tests found - skipping"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build release APKs (Universal + Split per ABI)
  # ─────────────────────────────────────────────────────────────
  build-apk:
    name: Build Release APKs
    needs: analyze
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Decode keystore if configured in Secrets
      - name: Decode keystore
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # 1. Build Split-per-ABI APKs (smaller downloads for phones)
      - name: Build split-per-abi APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL || 'ws://13.235.12.217:8000' }}

      # 2. Build Universal APK (works on all architectures)
      - name: Build universal APK
        run: |
          flutter build apk \
            --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL || 'ws://13.235.12.217:8000' }}

      - name: List APK outputs
        run: ls -la build/app/outputs/flutter-apk/

      # Upload APKs as Actions artifact
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-${{ github.sha }}
          path: test1/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Route APKs directly to GitHub Releases (Tags & Rolling Main)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publish to GitHub Releases
    needs: build-apk
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apks-${{ github.sha }}
          path: apk-files/

      - name: Determine Release Tag and Title
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Language Partner Matcher ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest Continuous Build (main)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          prerelease: ${{ steps.release_meta.outputs.is_prerelease == 'true' }}
          files: apk-files/*.apk
          generate_release_notes: true
          body: |
            ### 📱 Language Partner Matcher — Mobile App Build
            - **Commit**: `${{ github.sha }}`
            - **Branch/Tag**: `${{ github.ref_name }}`
            - **Backend Endpoint**: `${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }}`

            #### 📥 Download the APK for your device:
            - **`app-release.apk`**: Universal APK (Works on any Android phone)
            - **`app-arm64-v8a-release.apk`**: Optimized for modern phones (2018+, 64-bit ARM)
            - **`app-armeabi-v7a-release.apk`**: For older 32-bit Android phones
            - **`app-x86_64-release.apk`**: For PC Android emulators (BlueStacks, Android Studio)

            ---
            *Built automatically by GitHub Actions CI/CD.*

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Build Flutter Web (Access Remotely in Browser)
  # ─────────────────────────────────────────────────────────────
  build-web:
    name: Build Flutter Web for Browser
    needs: analyze
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: test1
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Compile Flutter Web
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://13.235.12.217:8000' }} \
            --dart-define=WS_BASE_URL=${{ secrets.WS_BASE_URL || 'ws://13.235.12.217:8000' }}

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build-${{ github.sha }}
          path: test1/build/web/
          retention-days: 30
