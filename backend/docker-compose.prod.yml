services:
  # 1. FastAPI Application & WebSocket Signaling
  fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langmatcher_backend_prod
    restart: always
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # All secrets are loaded from .env (written by bootstrap.sh from AWS Secrets Manager)
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  # 2. Managed PostgreSQL Database
  # Note: In the decoupled production architecture, replace this service
  # with your AWS RDS endpoint in DATABASE_URL inside .env
  postgres_db:
    image: postgres:15-alpine
    container_name: langmatcher_postgres_prod
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis In-Memory Cache & Pub/Sub Matchmaking
  # Note: In the decoupled production architecture, replace this service
  # with your dedicated Redis EC2 private IP in REDIS_URL inside .env
  redis_cache:
    image: redis:7-alpine
    container_name: langmatcher_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Coturn STUN/TURN Media Relay Server
  # Note: In the decoupled production architecture, this service is replaced
  # by the standalone CoTURN EC2. Set TURN_DOMAIN and TURN_SHARED_SECRET in .env
  coturn_turn:
    build:
      context: ./coturn
      dockerfile: Dockerfile
    container_name: langmatcher_coturn_prod
    restart: always
    network_mode: "host"
    environment:
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}

volumes:
  postgres_prod_data:
  redis_prod_data:
