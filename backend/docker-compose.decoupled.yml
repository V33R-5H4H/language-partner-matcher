services:
  fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langmatcher_backend_prod
    restart: always
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
