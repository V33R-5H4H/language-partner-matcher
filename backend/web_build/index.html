<!DOCTYPE html>
<html lang="en">
<head>

  <title>Language Partner Matcher - Web App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      align-items: center;

    <p><code>flutter build web --release --dart-define=API_BASE_URL=http://13.235.12.217:8000</code></p>
