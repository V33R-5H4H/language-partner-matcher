# ====================================================================
# Coturn TURN/STUN Server Production Configuration
# Language Partner Matcher - Production WebRTC Media Relay
# ====================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Relay port range (Allow sufficient UDP ports for concurrent calls)
min-port=49152
max-port=65535

# Network interface binding (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# External public IP (Set via Docker environment or static AWS Elastic IP)
# external-ip=YOUR_PUBLIC_IP

# Realm & Server Domain
realm=turn.langmatcher.com
server-name=turn.langmatcher.com

# Authentication: Use Time-Limited HMAC-SHA1 Shared Secret (REST API Authentication)
use-auth-secret
static-auth-secret=coturn_production_shared_secret_789xyz

# Security & Traffic Hardening
fingerprint
lt-cred-mech
stale-nonce=600
no-loopback-peers
no-multicast-peers

# Disable legacy/insecure protocols
no-sslv2
no-sslv3
no-tlsv1
no-tlsv1_1

# Quotas and rate limiting (prevent DoS attacks)
user-quota=100
total-quota=2000
max-allocate-per-user=10

# Logging
verbose
log-file=stdout
simple-log
