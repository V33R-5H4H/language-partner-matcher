# ====================================================================
# Coturn TURN/STUN Server Configuration — Language Partner Matcher
# ====================================================================
# Deploy this file to your standalone CoTURN EC2.
# The static-auth-secret value below is a placeholder — replace it
# with the actual value from your AWS Secrets Manager / .env.
# ====================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Relay port range (sufficient UDP ports for concurrent calls)
min-port=49152
max-port=65535

# Network interface binding (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# External public IP — REQUIRED for NAT traversal.
# Set to: external-ip=<PUBLIC_ELASTIC_IP>/<PRIVATE_IP>
# Example: external-ip=13.204.31.90/172.31.5.46
# Leave commented out; set this when deploying the server.
# external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP

# Realm & Server Domain
realm=turn.langmatcher.com
server-name=turn.langmatcher.com

# Authentication: HMAC-SHA1 Shared Secret (REST API Authentication)
# IMPORTANT: Replace CHANGE_ME_TURN_SECRET with your actual secret.
# This must match the TURN_SHARED_SECRET value in your backend .env.
# Generate a strong secret: openssl rand -hex 32
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET

# Security & Traffic Hardening
fingerprint
lt-cred-mech
stale-nonce=600
no-loopback-peers
no-multicast-peers

# Disable legacy/insecure protocols
no-sslv2
no-sslv3
no-tlsv1
no-tlsv1_1

# Quotas and rate limiting (prevent DoS attacks)
user-quota=100
total-quota=2000
max-allocate-per-user=10

# Logging
verbose
log-file=stdout
simple-log
